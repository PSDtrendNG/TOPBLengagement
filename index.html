<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>BL Couple Tracker · Talkwalker</title>
  <style>
    :root {
      --bg: #0f1117;
      --card: #1a1d27;
      --border: #2a2e3b;
      --text: #e8eaed;
      --muted: #9aa0a6;
      --accent: #8b5cf6;
      --accent-soft: rgba(139, 92, 246, 0.15);
      --green: #34d399;
      --orange: #f59e0b;
      --header-bg: #161922;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 24px 16px 48px;
      line-height: 1.45;
      -webkit-text-size-adjust: 100%;
    }
    .container { max-width: 1120px; margin: 0 auto; }
    header {
      display: flex; flex-wrap: wrap; align-items: center;
      justify-content: space-between; gap: 16px; margin-bottom: 16px;
    }
    h1 { font-size: 1.4rem; font-weight: 650; letter-spacing: -0.02em; }
    h1 span { color: var(--accent); }
    .meta { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .updated { font-size: 0.85rem; color: var(--muted); }
    .btn {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 8px 14px; border-radius: 8px; border: 1px solid var(--border);
      background: var(--card); color: var(--text); font-size: 0.875rem;
      font-weight: 500; cursor: pointer; transition: all 0.15s ease;
      -webkit-tap-highlight-color: transparent;
    }
    .btn:hover { border-color: var(--accent); background: var(--accent-soft); }
    .btn-primary { background: var(--accent); border-color: var(--accent); color: #fff; }
    .btn-primary:hover { filter: brightness(1.1); background: var(--accent); }
    .btn-sm { padding: 5px 9px; font-size: 0.75rem; border-radius: 6px; }

    .table-wrap {
      overflow: auto;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: var(--card);
      box-shadow: 0 4px 24px rgba(0,0,0,0.25);
      -webkit-overflow-scrolling: touch;
      max-height: calc(100vh - 160px);
    }
    table { width: 100%; border-collapse: separate; border-spacing: 0; min-width: 780px; }
    thead { position: sticky; top: 0; z-index: 40; }
    th {
      padding: 11px 12px; font-size: 0.8rem; font-weight: 600;
      text-align: center; border-bottom: 1px solid var(--border);
      color: var(--muted); white-space: nowrap;
      background: var(--header-bg);
      position: sticky;
      top: 0;
      z-index: 40;
    }
    thead tr:nth-child(2) th {
      top: 42px;
      z-index: 39;
      background: var(--header-bg);
    }
    th.group { background: #12141c; color: var(--text); font-size: 0.85rem; }
    th.couple-col {
      text-align: left;
      min-width: 200px;
      left: 0;
      z-index: 50;
      background: var(--header-bg);
      box-shadow: 2px 0 6px rgba(0,0,0,0.25);
    }
    th.sortable { cursor: pointer; user-select: none; }
    th.sortable:hover { color: var(--accent); }
    th .sort-icon { opacity: 0.35; margin-left: 3px; font-size: 0.7rem; }
    th.sorted .sort-icon { opacity: 1; color: var(--accent); }

    td {
      padding: 10px 12px; border-bottom: 1px solid var(--border);
      text-align: center; font-variant-numeric: tabular-nums; font-size: 0.9rem;
      background: var(--card);
    }
    tr:last-child td { border-bottom: none; }
    tbody tr:hover td { background: rgba(139, 92, 246, 0.06); }
    td.couple {
      text-align: left;
      font-weight: 550;
      position: sticky;
      left: 0;
      z-index: 20;
      background: var(--card);
      box-shadow: 2px 0 6px rgba(0,0,0,0.2);
      min-width: 200px;
    }
    tbody tr:hover td.couple { background: #1e2130; }
    td.couple .hashtag-row {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-top: 3px;
    }
    td.couple .hashtag {
      font-size: 0.75rem;
      color: var(--muted);
      font-weight: 400;
    }
    .btn-copy-tag {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 2px 6px;
      font-size: 0.65rem;
      border-radius: 4px;
      border: 1px solid var(--border);
      background: #12141c;
      color: var(--muted);
      cursor: pointer;
      line-height: 1.2;
      transition: all 0.15s;
    }
    .btn-copy-tag:hover {
      border-color: var(--accent);
      color: var(--accent);
      background: var(--accent-soft);
    }
    .btn-copy-tag.copied {
      border-color: var(--green);
      color: var(--green);
    }

    .num-input {
      width: 90px; padding: 6px 8px; border-radius: 6px;
      border: 1px solid var(--border); background: #12141c;
      color: var(--text); text-align: right; font-size: 0.9rem;
      font-variant-numeric: tabular-nums;
    }
    .num-input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft); }
    .num-input::placeholder { color: #555; }
    .num-input.filled { border-color: rgba(52, 211, 153, 0.5); }

    .rank {
      display: inline-flex; align-items: center; justify-content: center;
      width: 22px; height: 22px; border-radius: 50%; font-size: 0.7rem;
      font-weight: 700; margin-right: 8px; background: var(--border);
      color: var(--muted); flex-shrink: 0;
    }
    .rank.top1 { background: #fbbf24; color: #1a1a1a; }
    .rank.top2 { background: #94a3b8; color: #1a1a1a; }
    .rank.top3 { background: #cd7f32; color: #1a1a1a; }

    .actions { display: flex; gap: 5px; justify-content: center; flex-wrap: wrap; }
    .link-tw { color: var(--accent); text-decoration: none; font-size: 0.75rem; }
    .highlight-high { color: var(--green); font-weight: 600; }
    footer { margin-top: 18px; font-size: 0.8rem; color: var(--muted); text-align: center; }

    .toast {
      position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
      background: #1a1d27; border: 1px solid var(--green); color: var(--green);
      padding: 10px 18px; border-radius: 8px; font-size: 0.9rem;
      box-shadow: 0 8px 24px rgba(0,0,0,0.4); z-index: 9999;
      opacity: 0; transition: opacity 0.25s; pointer-events: none;
      max-width: 90vw; text-align: center;
    }
    .toast.show { opacity: 1; }

    @media (max-width: 640px) {
      body { padding: 12px 8px 32px; }
      h1 { font-size: 1.15rem; }
      .num-input { width: 72px; font-size: 0.85rem; padding: 5px 6px; }
      th, td { padding: 8px 6px; font-size: 0.8rem; }
      th.couple-col, td.couple { min-width: 160px; }
      .btn-sm { padding: 4px 7px; font-size: 0.7rem; }
      table { min-width: 680px; }
      .table-wrap { max-height: calc(100vh - 130px); }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>BL Couple <span>Tracker</span></h1>
      <div class="meta">
        <span class="updated" id="lastUpdated">Chưa cập nhật</span>
        <button class="btn" id="btnSave">💾 Lưu</button>
        <button class="btn btn-primary" id="btnRefresh">↻ Làm mới</button>
      </div>
    </header>

    <div class="table-wrap">
      <table id="dataTable">
        <thead>
          <tr>
            <th rowspan="2" class="couple-col">Couple BL</th>
            <th colspan="2" class="group">Results</th>
            <th colspan="2" class="group">Engagement</th>
            <th rowspan="2" style="min-width:100px">Thao tác</th>
          </tr>
          <tr>
            <th class="sortable" data-col="r1">1 day <span class="sort-icon">▼</span></th>
            <th class="sortable" data-col="r7">7 day <span class="sort-icon">▼</span></th>
            <th class="sortable" data-col="e1">1 day <span class="sort-icon">▼</span></th>
            <th class="sortable sorted" data-col="e7">7 day <span class="sort-icon">▼</span></th>
          </tr>
        </thead>
        <tbody id="tableBody"></tbody>
      </table>
    </div>
    <footer>Dữ liệu tự lưu trên trình duyệt · Sắp xếp theo Engagement 7 day</footer>
  </div>
  <div class="toast" id="toast"></div>

  <script>
    const COUPLES = [
      { id: 1, name: "Perth – Santa", tag: "#PerthSanta" },
      { id: 2, name: "Teetee – Por", tag: "#TeeteePor" },
      { id: 3, name: "Keng – Namping", tag: "#KengNamping" },
      { id: 4, name: "Tle – Firstone", tag: "#TleFirstone" },
      { id: 5, name: "Pond – Phuwin", tag: "#PondPhuwin" },
      { id: 6, name: "William – Est", tag: "#WilliamEst" },
      { id: 7, name: "Gemini – Fourth", tag: "#GeminiFourth" },
      { id: 8, name: "Thomas – Kong", tag: "#ThomasKong" },
      { id: 9, name: "Au – Save", tag: "#AuSave" },
      { id: 10, name: "Inn – Ongsa", tag: "#InnOngsa" },
      { id: 11, name: "Zee – Nunew", tag: "#ZeeNunew" },
      { id: 12, name: "Copter – Bank", tag: "#CopterBank" }
    ];
    const TW_FREE = "https://www.talkwalker.com/social-media-analytics-search";
    const STORAGE_KEY = "bl_couple_tracker_v1";
    let data = {}, sortCol = "e7", sortDir = "desc", saveTimer = null;

    function parseNum(val) {
      if (val === "" || val == null) return 0;
      let s = String(val).trim().toUpperCase().replace(/,/g, "").replace(/\s/g, "");
      const m = s.match(/^([\d.]+)([KMB])?$/);
      if (m) {
        let v = parseFloat(m[1]);
        if (isNaN(v)) return 0;
        if (m[2] === "K") v *= 1e3;
        else if (m[2] === "M") v *= 1e6;
        else if (m[2] === "B") v *= 1e9;
        return Math.round(v);
      }
      const n = Number(s.replace(/[^\d.]/g, ""));
      return isNaN(n) ? 0 : Math.round(n);
    }

    function formatDisplay(val) {
      return (val === "" || val == null) ? "" : String(val);
    }

    function loadData() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) data = JSON.parse(raw);
      } catch (e) { data = {}; }
      COUPLES.forEach(c => {
        if (!data[c.id]) data[c.id] = { r1: "", r7: "", e1: "", e7: "" };
      });
    }

    function collectFromInputs() {
      COUPLES.forEach(c => {
        ["r1","r7","e1","e7"].forEach(f => {
          const el = document.getElementById(f + "_" + c.id);
          if (el) data[c.id][f] = el.value.trim();
        });
      });
    }

    function saveData(silent) {
      collectFromInputs();
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
        updateTimestamp(true);
        if (!silent) showToast("Đã lưu dữ liệu");
      } catch (e) {
        showToast("Không thể lưu");
      }
    }

    function autoSave() {
      clearTimeout(saveTimer);
      saveTimer = setTimeout(() => saveData(true), 400);
    }

    function updateTimestamp(saved) {
      const now = new Date();
      const h = String(now.getHours()).padStart(2, "0");
      const m = String(now.getMinutes()).padStart(2, "0");
      const d = String(now.getDate()).padStart(2, "0");
      const mo = String(now.getMonth() + 1).padStart(2, "0");
      document.getElementById("lastUpdated").textContent =
        (saved ? "Đã lưu lúc " : "Cập nhật lúc ") + h + ":" + m + " · " + d + "/" + mo;
    }

    function showToast(msg) {
      const t = document.getElementById("toast");
      t.textContent = msg;
      t.classList.add("show");
      setTimeout(() => t.classList.remove("show"), 2200);
    }

    function getSortedCouples() {
      const list = COUPLES.map(c => ({
        id: c.id, name: c.name, tag: c.tag,
        r1: parseNum(data[c.id] && data[c.id].r1),
        r7: parseNum(data[c.id] && data[c.id].r7),
        e1: parseNum(data[c.id] && data[c.id].e1),
        e7: parseNum(data[c.id] && data[c.id].e7)
      }));
      list.sort((a, b) => sortDir === "desc" ? b[sortCol] - a[sortCol] : a[sortCol] - b[sortCol]);
      return list;
    }

    function renderTable() {
      const tbody = document.getElementById("tableBody");
      const sorted = getSortedCouples();
      tbody.innerHTML = "";

      sorted.forEach((c, idx) => {
        const rankClass = idx === 0 ? "top1" : idx === 1 ? "top2" : idx === 2 ? "top3" : "";
        const tr = document.createElement("tr");

        const r1 = formatDisplay(data[c.id] && data[c.id].r1);
        const r7 = formatDisplay(data[c.id] && data[c.id].r7);
        const e1 = formatDisplay(data[c.id] && data[c.id].e1);
        const e7 = formatDisplay(data[c.id] && data[c.id].e7);

        tr.innerHTML =
          '<td class="couple">' +
            '<span class="rank ' + rankClass + '">' + (idx + 1) + '</span>' + c.name +
            '<div class="hashtag-row">' +
              '<span class="hashtag">' + c.tag + '</span>' +
              '<button class="btn-copy-tag" data-tag="' + c.tag + '" title="Copy hashtag">Copy</button>' +
            '</div>' +
          '</td>' +
          '<td><input class="num-input" id="r1_' + c.id + '" type="text" inputmode="numeric" placeholder="—" value="' + r1 + '" data-id="' + c.id + '" data-field="r1" /></td>' +
          '<td><input class="num-input" id="r7_' + c.id + '" type="text" inputmode="numeric" placeholder="—" value="' + r7 + '" data-id="' + c.id + '" data-field="r7" /></td>' +
          '<td><input class="num-input" id="e1_' + c.id + '" type="text" inputmode="numeric" placeholder="—" value="' + e1 + '" data-id="' + c.id + '" data-field="e1" /></td>' +
          '<td><input class="num-input" id="e7_' + c.id + '" type="text" inputmode="numeric" placeholder="—" value="' + e7 + '" data-id="' + c.id + '" data-field="e7" /></td>' +
          '<td><div class="actions">' +
            '<button class="btn btn-sm link-tw" data-open-tw="' + c.tag + '">Mở TW</button>' +
          '</div></td>';
        tbody.appendChild(tr);
      });

      const maxE7 = Math.max(0, ...sorted.map(c => c.e7));
      if (maxE7 > 0) {
        sorted.forEach(c => {
          const input = document.getElementById("e7_" + c.id);
          if (input && parseNum(input.value) === maxE7) input.classList.add("highlight-high");
        });
      }

      document.querySelectorAll(".num-input").forEach(inp => {
        if (inp.value.trim()) inp.classList.add("filled");
        inp.addEventListener("input", e => {
          data[e.target.dataset.id][e.target.dataset.field] = e.target.value.trim();
          e.target.classList.toggle("filled", !!e.target.value.trim());
          autoSave();
        });
        inp.addEventListener("change", e => {
          data[e.target.dataset.id][e.target.dataset.field] = e.target.value.trim();
          saveData(true);
        });
        inp.addEventListener("blur", e => {
          const field = e.target.dataset.field;
          data[e.target.dataset.id][field] = e.target.value.trim();
          if (field === "e7" || field === "r7") {
            setTimeout(() => { collectFromInputs(); renderTable(); }, 80);
          }
        });
      });

      document.querySelectorAll(".btn-copy-tag").forEach(btn => {
        btn.addEventListener("click", () => {
          const tag = btn.dataset.tag;
          if (navigator.clipboard) {
            navigator.clipboard.writeText(tag).then(() => {
              btn.textContent = "✓";
              btn.classList.add("copied");
              showToast("Đã copy " + tag);
              setTimeout(() => {
                btn.textContent = "Copy";
                btn.classList.remove("copied");
              }, 1500);
            }).catch(() => showToast("Không copy được"));
          } else {
            const ta = document.createElement("textarea");
            ta.value = tag;
            document.body.appendChild(ta);
            ta.select();
            document.execCommand("copy");
            document.body.removeChild(ta);
            showToast("Đã copy " + tag);
          }
        });
      });

      document.querySelectorAll("[data-open-tw]").forEach(btn => {
        btn.addEventListener("click", () => {
          const tag = btn.dataset.openTw;
          if (navigator.clipboard) {
            navigator.clipboard.writeText(tag).then(() => showToast("Đã copy " + tag)).catch(() => {});
          }
          window.open(TW_FREE, "_blank");
        });
      });

      document.querySelectorAll("th.sortable").forEach(th => {
        th.classList.toggle("sorted", th.dataset.col === sortCol);
      });
    }

    document.getElementById("btnSave").addEventListener("click", () => saveData(false));
    document.getElementById("btnRefresh").addEventListener("click", () => {
      collectFromInputs();
      renderTable();
      updateTimestamp();
      showToast("Đã sắp xếp lại bảng");
    });

    document.querySelectorAll("th.sortable").forEach(th => {
      th.addEventListener("click", () => {
        const col = th.dataset.col;
        if (sortCol === col) sortDir = sortDir === "desc" ? "asc" : "desc";
        else { sortCol = col; sortDir = "desc"; }
        collectFromInputs();
        renderTable();
      });
    });

    window.addEventListener("beforeunload", () => {
      collectFromInputs();
      try { localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); } catch (e) {}
    });

    loadData();
    renderTable();
    updateTimestamp();
    setTimeout(() => { collectFromInputs(); renderTable(); }, 250);
  </script>
</body>
</html>
